name: ndxplorer
channels:
  - conda-forge
dependencies:
  - pip
  - qt >=5
  - qtpy
  - pyqt
  - numpy
  - pyyaml
  - pyqtgraph
  - pathlib2
  - typing-extensions
  - scipy
  # Mask image I/O (TIFF via its bundled libtiff) and Find structure's
  # HDBSCAN and K-means (its clustering kernels; no scikit-learn/hdbscan).
  - tttrlib >=0.27
