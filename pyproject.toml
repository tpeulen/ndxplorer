[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndxplorer"
version = "1.0.0"
description = "ndXplorer: Multi-parameter fluorescence data analysis tool"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-2.1"}
authors = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
keywords = ["fluorescence", "single-molecule", "spectroscopy", "data-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "qtpy",
    "PyQt5",
    "pyqtgraph",
    "PyYAML",
    "click>=8.0.0",
    # Mask images (ndxplorer.utils.mask_helpers) are TIFF, read and written
    # with tttrlib's bundled libtiff -- ndxplorer is a TTTR explorer, so that is
    # a dependency it has anyway. Previously this went through
    # scikit-image/tifffile, neither of which was declared here, so loading a
    # mask raised ImportError on a clean install. The array TIFF API needs 0.27.
    "tttrlib>=0.27",
    # ChiSurf. Not an optional integration: region/lasso gates are
    # `chisurf.core.roi` shapes (ndxplorer.core.region_selection), the parameter
    # and constants tables are `chisurf.core.fitting.parameter` groups, and the
    # table editor, curve-fit dialog and glyphs come from `chisurf.gui`.
    # It was used in all of those places and declared in none, so a clean
    # install imported fine and then raised ModuleNotFoundError the first time
    # somebody drew a lasso.
    #
    # ChiSurf is on no package index; it and ndXplorer are installed from the
    # same source tree, which is why the documented install is
    # `pip install --no-deps -e .`. Naming it here is the statement of what this
    # package needs, not a resolvable requirement -- and a loud failure at
    # install time is the better half of the trade against a silent one at the
    # first drawn gate.
    "chisurf",
    # emtk draws the ranking panel ("Find informative projections"): its layout
    # is a view.json that emtk renders, hosted in a Qt window.
    "emtk",
]

[project.urls]
Homepage = "https://github.com/Fluorescence-Tools/ndxplorer"
Repository = "https://github.com/Fluorescence-Tools/ndxplorer"
"Bug Tracker" = "https://github.com/Fluorescence-Tools/ndxplorer/issues"

[project.scripts]
ndxplorer = "ndxplorer.__main__:main"

[project.gui-scripts]
ndxplorer-gui = "ndxplorer.__main__:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["ndxplorer*"]

[tool.setuptools.package-data]
"ndxplorer" = [
    "*.json", "*.yaml",
    "*.ui", "*.css", "*.qss",
    "*.png", "*.svg",
    "*.csv", "*.npy", "*.dat",
    "*.dll", "*.so", "*.pyd",
    "*.txt"
]
"ndxplorer.plotting" = ["*.ui", "*.json"]
# The emtk app's view specs, and those of its feature modules (plain folders
# beside the modules, not packages -- so they are named from ndxplorer.app).
"ndxplorer.app" = ["views/*.json", "features/*/*.json", "features/*/*.md"]
"ndxplorer.ui" = ["*.ui", "*.qrc", "*.png", "*.svg", "*.md", "*.json"]
"ndxplorer.settings" = ["*.json", "*.yaml"]
"ndxplorer.settings.templates" = ["*"]
