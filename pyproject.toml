[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndxplorer"
version = "1.0.0"
description = "ndXplorer: Multi-parameter fluorescence data analysis tool"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-2.1"}
authors = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
keywords = ["fluorescence", "single-molecule", "spectroscopy", "data-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
    "scipy",
    # Publication figures and the report (ndxplorer.export).
    "matplotlib",
    "PyYAML",
    "click>=8.0.0",
    # Mask images (ndxplorer.utils.mask_helpers) are TIFF, read and written
    # with tttrlib's bundled libtiff -- ndxplorer is a TTTR explorer, so that is
    # a dependency it has anyway. Previously this went through
    # scikit-image/tifffile, neither of which was declared here, so loading a
    # mask raised ImportError on a clean install. The array TIFF API needs 0.27.
    # Find structure's HDBSCAN and K-means are tttrlib's kernels too
    # (tttrlib.hdbscan, tttrlib.kmeans), so neither scikit-learn nor hdbscan
    # is needed; PCA is NumPy.
    "tttrlib>=0.27",
    # ChiSurf. Not an optional integration: region/lasso gates are
    # `chisurf.core.roi` shapes (ndxplorer.core.region_selection). It was used
    # there and declared nowhere, so a clean install imported fine and then
    # raised ModuleNotFoundError the first time somebody drew a lasso.
    #
    # ChiSurf is on no package index; it and ndXplorer are installed from the
    # same source tree, which is why the documented install is
    # `pip install --no-deps -e .`. Naming it here is the statement of what this
    # package needs, not a resolvable requirement -- and a loud failure at
    # install time is the better half of the trade against a silent one at the
    # first drawn gate.
    "chisurf",
    # emtk is the GUI: `python -m ndxplorer` opens the emtk app
    # (ndxplorer.app) in a native window, a Tk window or a browser tab. There is
    # no Qt GUI any more, so no Qt binding and no pyqtgraph.
    "emtk",
    # The app's splash/screenshots and the CLI's `image` PNGs.
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/Fluorescence-Tools/ndxplorer"
Repository = "https://github.com/Fluorescence-Tools/ndxplorer"
"Bug Tracker" = "https://github.com/Fluorescence-Tools/ndxplorer/issues"

[project.scripts]
ndxplorer = "ndxplorer.__main__:main"

[project.gui-scripts]
ndxplorer-gui = "ndxplorer.__main__:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["ndxplorer*"]

[tool.setuptools.package-data]
"ndxplorer" = [
    "*.json", "*.yaml",
    "*.css",
    "*.png", "*.svg",
    "*.csv", "*.npy", "*.dat",
    "*.dll", "*.so", "*.pyd",
    "*.txt"
]
"ndxplorer.plotting" = ["*.json", "colormap_data/*"]
"ndxplorer.analysis" = ["*.json"]
# The emtk app's view specs, those of its feature modules and its resources
# (plain folders beside the modules, not packages -- so they are named from
# ndxplorer.app).
"ndxplorer.app" = ["views/*.json", "features/*/*.json", "features/*/*.md", "resources/*"]
"ndxplorer.settings" = ["*.json", "*.yaml"]
"ndxplorer.settings.templates" = ["*"]
