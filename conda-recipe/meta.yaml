{% set pyproject = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set project = pyproject.get('project', {}) %}
{% set scripts = project.get('scripts', {}) %}
{% set gui_scripts = project.get('gui-scripts', {}) %}


package:
  name: {{ project.get('name')|lower }}
  version: {{ project.get('version') }}

source:
  path: ..

build:
    number: 0
    entry_points:
      {% for name, entry in scripts.items() -%}
      - {{ name }} = {{ entry }}
      {% endfor -%}
      {% for name, entry in gui_scripts.items() -%}
      - {{ name }} = {{ entry }}
      {% endfor %}
    script:
      - python -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python
    - typing_extensions
    - pyyaml
    - setuptools
    - numpy
    - toml
  run:
    - python
    - pyqt
    - qtpy
    - numpy
    - pyyaml
    - pyqtgraph
    - typing-extensions
    - matplotlib
    - scipy
    - umap-learn
    # Mask image I/O: TIFF via tttrlib's bundled libtiff.
    - tttrlib >=0.27
    # NOT chisurf, deliberately -- although pyproject.toml names it, and it is a
    # real requirement for region gates, the parameter tables and the table
    # editor. There is no chisurf conda package on any channel this recipe
    # builds against, so listing it here does not document the coupling, it
    # fails the build. The `test:` block below only imports `ndxplorer` and
    # launches the GUI, neither of which touches chisurf, so the package still
    # builds and verifies. Add it here once chisurf is published.

test:
  imports:
    - ndxplorer
  commands:
    - ndxplorer &        # [linux]

about:
  home: {{ project.get('urls', {}).get('Homepage', '') }}
  license: {{ project.get('license', {}).get('text', '') }}
  license_file: LICENSE
  summary: "{{ project.get('description') }}"
  description: |
    {{ project.get('description') }}

extra:
  recipe-maintainers:
    - tpeulen
